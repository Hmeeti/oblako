services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stolio
      POSTGRES_PASSWORD: stolio_dev_password
      POSTGRES_DB: stolio
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stolio -d stolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
