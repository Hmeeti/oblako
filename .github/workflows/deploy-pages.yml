# Hybrid deploy: GitHub Pages (menu) + Railway (admin/API)

name: Deploy GitHub Pages (guest menu)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          # Guest menu only — do not publish admin panel on Pages
          cp index.html _site/
          cp -r css js image _site/
          # Drop heavy HEIC sources from Pages (keep web dishes + logo)
          rm -f _site/image/*.HEIC _site/image/*.heic || true
          rm -rf _site/image/optimized || true
          # Ensure config.js exists
          test -f _site/js/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
