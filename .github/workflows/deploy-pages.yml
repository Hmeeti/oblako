# Publishes the site to GitHub Pages on every push to main
# (including commits made by the admin panel). Data is validated first:
# if the check fails, nothing is deployed and the live site stays as it was.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits and replaces older queued ones
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check data files and links
        run: node .github/scripts/validate.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Collect public files
        run: |
          mkdir -p _site/data
          cp index.html sw.js manifest.webmanifest robots.txt _site/
          cp -r css js image admin _site/
          cp data/menu.json data/site.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
