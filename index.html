<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OBLAKO — электронное меню лаундж-бара. Кухня, бар и кальянная атмосфера.">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OBLAKO">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OBLAKO — Меню">
  <meta property="og:description" content="Электронное меню лаундж-бара OBLAKO">
  <meta property="og:image" content="https://hmeeti.github.io/oblako/image/logo.webp">
  <meta property="og:url" content="https://hmeeti.github.io/oblako/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="OBLAKO — Меню">
  <meta name="twitter:image" content="https://hmeeti.github.io/oblako/image/logo.webp">
  <title>OBLAKO — Меню</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="image/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=13">
  <link rel="stylesheet" href="css/cart.css?v=13">
</head>
<body>

  <header class="site-header">
    <img class="site-header__logo" src="image/logo.webp" alt="OBLAKO" width="360" height="217" decoding="async" fetchpriority="high">
    <p class="site-header__intro" id="home-intro" hidden></p>
    <div class="search" id="search-wrap">
      <input class="search__input" type="search" id="search" placeholder="Поиск блюда или напитка…" aria-label="Поиск по меню" autocomplete="off" enterkeyhint="search">
      <button class="search__clear" type="button" id="search-clear" aria-label="Очистить поиск" hidden>&times;</button>
    </div>
    <div class="view-toggle" id="view-toggle" role="group" aria-label="Вид меню">
      <button class="view-toggle__btn is-active" type="button" data-view="grid" aria-label="Сетка" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="view-toggle__btn" type="button" data-view="list" aria-label="Список" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы меню">
    <div class="tabs__list" id="tabs-list"></div>
  </nav>

  <main class="main">
    <section class="promos" id="promos" aria-label="Акции и события" hidden></section>
    <div id="menu-root"></div>
    <div id="rules-root" hidden></div>
    <div class="empty" id="empty-state" hidden></div>
  </main>

  <footer class="site-footer">
    <address class="contacts" id="contacts" hidden></address>
    <p>© 2026 OBLAKO — Все права защищены</p>
    <p class="site-footer__dev">Разработано<span class="site-footer__dev-name">hmeeti</span></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <nav class="dock" id="dock" aria-label="Быстрая навигация">
    <button class="dock__btn" type="button" data-action="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z"/></svg>
      <span>Меню</span>
    </button>
    <button class="dock__btn" type="button" data-action="categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Разделы</span>
    </button>
    <button class="dock__btn" type="button" data-action="rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 4h9l3 3v13H6z"/><path d="M15 4v4h4"/><path d="M9 12h6M9 16h6"/></svg>
      <span>Правила</span>
    </button>
    <a class="dock__btn" id="dock-call" href="#" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
      <span>Позвонить</span>
    </a>
    <button class="dock__btn dock__btn--accent" type="button" data-action="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span>Корзина</span>
    </button>
  </nav>

  <script src="js/app.js?v=13" defer></script>
  <script src="js/cart.js?v=13" defer></script>
  <script src="js/ui.js?v=13" defer></script>
</body>
</html>
